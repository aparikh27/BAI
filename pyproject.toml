[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bai-agentcore"
version = "0.1.0"
description = "Behavioral Autonomy Infrastructure: multi-agent robotics orchestration and RL training."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "BAI Contributors" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "numpy>=1.26,<3.0",
    "opencv-python>=4.9,<5.0",
    "sounddevice>=0.4.6,<1.0",
    "torch>=2.2,<2.7",
    "ultralytics>=8.2,<9.0",
    "openai-whisper>=20231117",
    "llama-cpp-python>=0.2.70,<1.0",
    "gymnasium>=0.29,<1.1",
    "stable-baselines3>=2.3,<3.0",
    "tensorboard>=2.16,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "backend*", "rl*", "MemoryEngine*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["agents/tests", "backend/tests", "rl"]
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"
